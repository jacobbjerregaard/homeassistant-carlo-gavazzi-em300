name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # The brands check requires Carlo Gavazzi's own icon and logo, either
          # committed here or accepted into home-assistant/brands. Neither is
          # ours to invent, and the check only gates inclusion in the HACS
          # default store -- installing this as a custom repository does not
          # need it. See the README for what submitting the real assets takes.
          ignore: "brands"

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
